services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-productgpt}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      # Tuned for DO Basic 4 GB / 2 vCPU — ~1.5 GB Neo4j, leaves room for OS + backend + nginx
      # Neo4j 5 uses server.memory.* (dbms.threads.worker.count is invalid and fails strict validation)
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # First boot downloads GDS plugin and can take several minutes
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-productgpt}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SHOPIFY_API_BASE_URL: ${SHOPIFY_API_BASE_URL:-}
      SHOPIFY_API_TOKEN: ${SHOPIFY_API_TOKEN:-}
      SHOPIFY_API_SHOP_DOMAIN: ${SHOPIFY_API_SHOP_DOMAIN:-}
      SHOPIFY_API_PAGE_LIMIT: ${SHOPIFY_API_PAGE_LIMIT:-0}
      SHOPIFY_API_REQUESTS_PER_MINUTE: ${SHOPIFY_API_REQUESTS_PER_MINUTE:-100}
      SHOPIFY_API_TIMEOUT_SECONDS: ${SHOPIFY_API_TIMEOUT_SECONDS:-60}
      PUBLIC_API_TOKEN: ${PUBLIC_API_TOKEN:-}
      SHOPIFY_ENRICH_DETAILS: ${SHOPIFY_ENRICH_DETAILS:-true}
      SHOPIFY_ENRICH_DETAIL_RESOURCES: ${SHOPIFY_ENRICH_DETAIL_RESOURCES:-customers,orders}
    volumes:
      - app_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  app_data:
